# Cabeceras de seguridad, en archivo aparte a proposito.
#
# En nginx `add_header` NO se hereda si el bloque hijo declara el suyo. Los
# tres `location` del sitio declaran `Cache-Control`, asi que sin este
# `include` en cada uno las cabeceras del bloque `server` no llegan a ninguna
# respuesta: estarian escritas y no se aplicarian. Ver §21 de docs/MEJORAS.md.
#
#   include /etc/nginx/snippets/cabeceras-seguridad.conf;
#
# `always` no es opcional: sin eso nginx las omite en las respuestas de error,
# que es justo donde una pagina inyectada haria dano.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Defensa heredada para navegadores que no entienden `frame-ancestors`.
add_header X-Frame-Options "DENY" always;

# `frame-src` permite youtube-nocookie y vimeo, los dos unicos destinos que
# `medios.video` puede tomar cuando el video del Centenario este listo. Esta
# copia conserva la franja del video —§18 no se aplico aqui—, asi que el
# permiso sigue en uso y no se cierra a 'none'.
#
# El `'unsafe-inline'` de `script-src` no se puede quitar: son 165 scripts en
# linea distintos entre las trece paginas, la carga de React. Ver §15.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
