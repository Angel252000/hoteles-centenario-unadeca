# nginx — usar si ya hay uno andando en la máquina. Ver deploy/README.md.
#
# Va en /etc/nginx/sites-available/ y se enlaza desde sites-enabled/.
# Reemplazar SITIO por el dominio real y las rutas de los certificados.
#
# El certificado no se saca solo: `certbot --nginx -d SITIO` la primera vez, y
# revisar que el temporizador de renovación quede activo
# (`systemctl list-timers | grep certbot`). Es el paso que se olvida.

server {
	listen 80;
	listen [::]:80;
	server_name SITIO;
	# Todo por HTTPS. El HSTS de abajo solo tiene efecto si se llega por aquí
	# al menos una vez.
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name SITIO;

	root /var/www/hoteles;
	index index.html;

	ssl_certificate     /etc/letsencrypt/live/SITIO/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/SITIO/privkey.pem;

	# TLS 1.2 y 1.3 nada más. Lo anterior está roto y ya no lo necesita nadie.
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;
	ssl_stapling on;
	ssl_stapling_verify on;

	# No anunciar la versión de nginx en cada respuesta ni en las páginas de
	# error.
	server_tokens off;

	# --- Compresión ---
	# `gzip_static` sirve el `.gz` que dejó el build. `brotli_static` necesita
	# el módulo ngx-brotli: si no está compilado, comentar esa línea y el
	# sitio sigue andando con gzip —17 KB en vez de 10.8 KB en la portada—.
	gzip_static on;
	brotli_static on;

	# --- Cabeceras ---
	# `always` no es opcional: sin eso nginx omite la cabecera en las
	# respuestas de error, que son justo donde una página inyectada haría daño.
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
	add_header Cross-Origin-Opener-Policy "same-origin" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

	# `frame-ancestors 'none'` es lo que impide que otro sitio enmarque este.
	# El `'unsafe-inline'` de `script-src` no se puede quitar: son 165 scripts
	# en línea distintos entre las trece páginas, la carga de React. Ver la
	# sección 15 de docs/MEJORAS.md.
	add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

	# --- Cache ---
	# El ancho o el hash van en el nombre del archivo: contenido nuevo, URL
	# nueva. Se pueden cachear para siempre.
	location ^~ /opt/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
	}

	location ^~ /_next/static/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
	}

	# El HTML revalida siempre, o nadie ve los cambios al publicar.
	location / {
		add_header Cache-Control "public, max-age=0, must-revalidate" always;
		try_files $uri $uri.html $uri/index.html =404;
	}

	error_page 404 /404.html;
}
