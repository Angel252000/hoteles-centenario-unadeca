# Configuración de publicación. Vive en el repositorio a propósito: el
# `netlify.toml` que aparece dentro de `.netlify/` lo genera el plugin en
# cada build y está ignorado por git.

[build]
  # `pnpm build` corre `next build` y después quita `/comision` de `out/`.
  # Ver `scripts/quitar-comision.mjs`.
  command = "pnpm build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # Que el build falle si el lockfile no cuadra con package.json, en vez de
  # resolver versiones por su cuenta y publicar algo distinto a lo probado.
  NPM_FLAGS = "--frozen-lockfile"
